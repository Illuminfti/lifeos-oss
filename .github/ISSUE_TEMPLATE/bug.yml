name: Bug report
description: Report a reproducible LifeOS defect
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, sessions, raw captures, or personal canonical data.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal synthetic steps and exact command output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LifeOS version
    validations:
      required: true
