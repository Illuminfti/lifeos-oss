name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,telegram]'
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q src
      - name: Public boundary
        run: python scripts/scan_public.py

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install --no-deps --target /tmp/lifeos-wheel dist/*.whl
          PYTHONPATH=/tmp/lifeos-wheel python -m compileall -q /tmp/lifeos-wheel/lifeos
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-dist
          path: dist/*
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag lifeos:${{ github.sha }} .
      - name: Smoke container
        run: |
          mkdir -p /tmp/lifeos-brain
          chmod 0777 /tmp/lifeos-brain
          docker run --rm -v /tmp/lifeos-brain:/data/brain lifeos:${{ github.sha }} init /data/brain
          docker run --rm -v /tmp/lifeos-brain:/data/brain lifeos:${{ github.sha }} doctor
