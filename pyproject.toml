[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.2.0"
description = "Open-source evidence-to-canon life world model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LifeOS contributors"}]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.22"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lifeos = "lifeos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lifeos.resources" = ["*.yaml", "json-schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
